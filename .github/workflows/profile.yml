# Builds the profile panels with scripts/profile.py.
#  - static panels (assets/*.svg): rebuilt and committed only when they change
#    (for example after editing a text in scripts/profile.py)
#  - live panel (signal.svg: contributions, streaks, repos, languages):
#    regenerated every 12 hours and published on the "output" branch
# Replaces the old snake workflow: delete .github/workflows/snake.yml.

name: profile

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Build the panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/profile.py

      - name: Commit the static panels if they changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "profile: rebuild panels"
            git push
          fi

      - name: Publish the live panel on the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
