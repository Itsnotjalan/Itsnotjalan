# À placer dans le dépôt de profil, au chemin : .github/workflows/snake.yml
# Génère le serpent (crème sur champ sépia) toutes les 12 h dans la branche "output".

name: Serpent des contributions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Générer le SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#F1E4CF&color_dots=#161B22,#342816,#62492F,#9C7B5B,#C4A98B

      - name: Publier dans la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
